<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="btnInc">Increment</button>
    <span id="count"></span>

    <script>
        var btnInc = document.getElementById("btnInc");
        var count = document.getElementById("count");
        var count = 0;

        function fn() {
            count++;
            console.log(count);
        }

        btnInc.onclick = fn;
    </script>
</body>
</html>
