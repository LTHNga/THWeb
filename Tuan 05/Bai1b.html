<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cong tru nhan chia</title>
</head>

<body>
    <script>
        var button1 = document.createElement('button');
        button1.textContent = 'Cong';
        button1.onclick = () => {
            // console.log("click1")
            var a = prompt("Nhap gia tri a")
            var b = prompt("Nhap gia tri b:")
            var tong = parseInt(a) + parseInt(b)
            console.log("Tong:", tong)
        }
        document.body.appendChild(button1)

        var button2 = document.createElement('button');
        button2.textContent = 'Tru';
        button2.onclick = () => {
            // console.log("click2")
            var a = prompt("Nhap gia tri a")
            var b = prompt("Nhap gia tri b:")
            var hieu = parseInt(a) - parseInt(b)
            console.log("Hieu:", hieu)
        }
        document.body.appendChild(button2)

        var button3 = document.createElement('button');
        button3.textContent = 'Nhan';
        button3.onclick = () => {
            // console.log("click3")
            var a = prompt("Nhap gia tri a")
            var b = prompt("Nhap gia tri b:")
            var tich = parseInt(a) * parseInt(b)
            console.log("Tich:", tich)
        }
        document.body.appendChild(button3)

        var button4 = document.createElement('button');
        button4.textContent = 'Chia';
        button4.onclick = () => {
            // console.log("click4")
            var a = prompt("Nhap gia tri a")
            var b = prompt("Nhap gia tri b:")
            var thuong = parseInt(a) / parseInt(b)
            console.log("Thuong:", thuong)
        }
        document.body.appendChild(button4)
    </script>
</body>

</html>
