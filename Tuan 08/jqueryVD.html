<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore Online - Thao tác DOM</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
        }

        .book {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        .price {
            color: #e74c3c;
            font-weight: bold;
        }

        .fiction-highlight {
            border: 2px solid orange !important;
            background-color: #fff8e1;
        }

        .featured {
            border: 3px solid green !important;
            background-color: #e8ffe8;
        }

        input {
            padding: 8px;
            width: 300px;
            margin-bottom: 10px;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f4f4f4;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>Chào mừng đến Bookstore Online</h1>

    <input
        type="text"
        id="search-box"
        placeholder="Tìm kiếm sách..."
    >

    <br>

    <label>
        <input type="checkbox" id="agree-checkbox">
        Đồng ý điều khoản
    </label>

    <hr>

    <div id="book-list">

        <div class="book" data-genre="fiction">
            <h3>Đắc Nhân Tâm</h3>
            <p class="price">120.000đ</p>
        </div>

        <div class="book" data-genre="skill">
            <h3>Tư Duy Nhanh và Chậm</h3>
            <p class="price">150.000đ</p>
        </div>

        <div class="book" data-genre="fiction">
            <h3>Nhà Giả Kim</h3>
            <p class="price">89.000đ</p>
        </div>

    </div>

    <div id="result">
        <h3>Kết quả thực hành</h3>
        <p id="count"></p>
        <p id="first-book"></p>
    </div>

    <script>
        $(function () {

            // 1. SELECTORS CƠ BẢN
            let totalBooks = $(".book").length;
            console.log("Tổng số sách:", totalBooks);
            $("#count").text("Tổng số sách: " + totalBooks);
            $("[data-genre='fiction']").addClass("fiction-highlight");
            console.log("Số sách fiction:",$("[data-genre='fiction']").length);

            let firstBook = $(".book:first h3").text();
            console.log("Sách đầu tiên:",firstBook);
            $("#first-book").text("Sách đầu tiên: " + firstBook);

            // 2.1 ĐỌC & THAY ĐỔI NỘI DUNG
            console.log($(".book:first h3").text());
            $(".book:first h3").text("Đắc Nhân Tâm (Bản mới)");
            $(".book:first .price").html("<strong>120.000đ</strong>");
            $("#search-box").val("Nhà Giả Kim");
            console.log($("#search-box").val());

            // 2.2 ATTR - PROP - DATA
            console.log("Data genre cũ:",$(".book:first").attr("data-genre"));
            $(".book:first").attr("data-genre","self-help");
            $("#agree-checkbox").prop("checked",true);
            console.log("Data genre:",$(".book:first").data("genre"));

            // 2.3 CSS & CLASS
            $(".price").css("color","red");
            $(".price").css({color: "red",fontWeight: "bold",fontSize: "18px"});
            $(".book:first").addClass("featured");
            console.log($(".book:first").hasClass("featured"));
            $(".book:first").removeClass("featured");
            $(".book:first").toggleClass("featured");

            // 2.4 THÊM / XÓA PHẦN TỬ
            $("#book-list").append(`
                <div class="book" data-genre="skill">
                    <h3>7 Thói Quen Hiệu Quả</h3>
                    <p class="price">135.000đ</p>
                </div>
            `);

            $("#book-list").prepend("<p>Sách mới về!</p>");
            $(".book:first").before("<hr>");
            $(".book:last").after("<p>Hết danh sách</p>");
            $(".book[data-genre='skill']:last").remove();

        });
    </script>

</body>
</html>
